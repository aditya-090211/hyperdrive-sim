<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HYPERDRIVE Simulator · Overdrive 009</title>
<link rel="canonical" href="https://hyperdrive-sim.vercel.app/sim">
<meta name="description" content="Physics-accurate match simulator for the NRL 2026 game HYPERDRIVE: the official field CAD, the NRL-2026 robot CAD, four robots and live scoring. Built by team Overdrive 009.">
<meta name="theme-color" content="#19161a">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="HYPERDRIVE Simulator by Overdrive 009">
<meta property="og:description" content="Drive four robots on the official NRL 2026 HYPERDRIVE field with real physics and live scoring.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="stylesheet" href="css/app.css?v=16">
<link rel="stylesheet" href="css/tools.css">
<link rel="stylesheet" href="css/tools-planner.css">
<link rel="stylesheet" href="css/tools-trainer.css">
<link rel="stylesheet" href="css/tools-strategy.css">
<link rel="stylesheet" href="css/tools-designer.css">
<link rel="preload" href="/assets/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/punk.css?v=2">
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<!-- the simulator's module graph and both models in parallel, so the loading bar is not a waterfall -->
<link rel="preload" as="image" href="assets/poster-sim-wide.jpg" media="(min-width: 861px)" fetchpriority="high">
<link rel="preload" as="image" href="assets/poster-sim-tall.jpg" media="(max-width: 860px)" fetchpriority="high">
<link rel="modulepreload" href="lib/three.module.js">
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/physics.js">
<link rel="modulepreload" href="js/physics-core.js">

<link rel="modulepreload" href="js/robot-model.js">
<link rel="modulepreload" href="js/game.js">

<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/arena.js">
<link rel="modulepreload" href="js/config.js">
<link rel="modulepreload" href="js/settings.js">

<link rel="modulepreload" href="lib/BufferGeometryUtils.js">

<link rel="preload" href="assets/field.json?v=3" as="fetch" crossorigin>

</head>
<body>
<noscript><div class="noscript">HYPERDRIVE is a 3D simulator and needs JavaScript and WebGL. Turn JavaScript on and reload.</div></noscript>
<div id="view"></div>

<!-- ======================================================== MAIN MENU -->
<section id="menu" class="hidden">
  <header class="menu-top">
    <a class="mark" href="/" title="Overdrive home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M22.6 7.7A11 11 0 1 0 22.6 24.3" stroke="#f2ede3" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M14.6 10.6l5.6 5.4-5.6 5.4" stroke="#e2531b" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="mark-name">Overdrive <i>009</i></span></a>
    <nav class="menu-nav">
      <a class="nav-btn" href="/scout" title="Overdrive Scout" aria-label="Overdrive Scout"><span data-icon="clipboard"></span></a>
      <button class="nav-btn" data-act="howto" title="How to play" aria-label="How to play"><span data-icon="book"></span></button>
      <button class="nav-btn" data-act="leaderboard" title="Leaderboard" aria-label="Leaderboard"><span data-icon="trophy"></span></button>
      <button class="nav-btn" data-act="settings" title="Settings" aria-label="Settings"><span data-icon="sliders"></span></button>
      <div id="menu-user"></div>
    </nav>
  </header>
  <div class="menu-main">
    <div class="hero">
      <h1 class="logo">HYPER<span>DRIVE</span></h1>
      <p class="tagline">Practise NRL 2026 matches on the real field, with real physics.</p>
      <button class="team-chip" data-act="settings" title="Change your team number"><span class="tc-plate" id="menu-team">009</span><span class="tc-txt"><b>Your robot</b><small>Team number on the plate</small></span></button>
      <div class="modes">
        <button class="mode primary" data-act="play" title="2:30 match, up to 4 drivers on this computer"><span class="mi"><span data-icon="play"></span></span><span class="mt"><b>Play</b></span></button>
        <button class="mode" data-act="online" title="Every driver on their own laptop"><span class="mi"><span data-icon="globe"></span></span><span class="mt"><b>Online</b></span></button>
        <button class="mode" data-act="practice" title="No clock, learn the controls"><span class="mi"><span data-icon="target"></span></span><span class="mt"><b>Practice</b></span></button>
        <button class="mode" data-act="robotcode" title="Import your OpMode (.cpp) and run it on the field"><span class="mi"><span data-icon="cpu"></span></span><span class="mt"><b>Robot code</b></span></button>
      </div>
      <div class="tools" aria-label="Team tools">
        <span class="tools-h">Team tools</span>
        <button class="tool" data-act="planner" title="Plan an auto route on the field, export the OpMode, test it on imperfect robots"><span data-icon="flag"></span><b>Auto planner</b></button>
        <button class="tool" data-act="trainer" title="Timed drills against the AI, with ghost replays of your best runs"><span data-icon="target"></span><b>Driver trainer</b></button>
        <button class="tool" data-act="strategy" title="Predict scores and win odds for alliance pairings"><span data-icon="users"></span><b>Alliance strategy</b></button>
        <button class="tool" data-act="designer" title="Change the robot's design and measure what it does"><span data-icon="sliders"></span><b>Robot designer</b></button>
      </div>
      <button class="lnk learn" data-act="learn">Learn to play</button>
      <div id="menu-account" class="acct-line"></div>
    </div>
  </div>
  <div class="spin-hint" aria-hidden="true"><span></span>Drag to turn the robot</div>
  <footer class="menu-foot">
    <span>Built by Overdrive 009. Not affiliated with the National Robotics League · <button class="lnk" data-act="privacy">Privacy</button></span>
  </footer>
</section>

<!-- ======================================================== IN-GAME HUD -->
<section id="hud" class="hidden">
  <div class="hud-tl">
    <button class="hud-btn" id="btn-pause" title="Menu (Esc)"><span data-icon="menu"></span></button>
    <button class="hud-btn" id="btn-cam" title="Camera (C)"><span data-icon="video"></span><span class="lbl" id="cam-label">Driver station</span></button>
  </div>
  <div class="hud-tr">
    <button class="hud-btn net-pill hidden" id="net-pill" title="Online room"></button>
  </div>

  <!-- one slim broadcast scoreboard: score · clock · score, STARBURST progress as an underline, STAR MAP as pips -->
  <div id="scorebar" role="button" tabindex="0" aria-expanded="false" aria-controls="details" title="Score breakdown (click, or hold Tab)">
    <div class="sb-side red" id="sbt-red"><span class="sb-name">RED</span><span class="sb-score" id="score-red">0</span><i class="sb-prog"><b id="prog-red"></b></i></div>
    <div class="sb-mid"><div id="clock">2:30</div><div id="phase">Pre-match</div><div class="sb-map" id="starmap"></div></div>
    <div class="sb-side blue" id="sbt-blue"><span class="sb-score" id="score-blue">0</span><span class="sb-name">BLUE</span><i class="sb-prog"><b id="prog-blue"></b></i></div>
  </div>

  <div id="feed"></div>
  <div id="banner"></div>
  <div id="details" class="card hidden"></div>
  <div id="center"></div>
  <div id="coach" class="hidden" role="region" aria-label="Tutorial" aria-live="polite"></div>

  <div class="dock red" id="dock-red">
    <div class="hp" id="hp-red"></div>
    <div class="rcards" id="rc-red"></div>
  </div>
  <div class="dock blue" id="dock-blue">
    <div class="hp" id="hp-blue"></div>
    <div class="rcards" id="rc-blue"></div>
  </div>

  <div id="touch" class="hidden"></div>
</section>

<div id="modal-root"></div>
<div id="toast"></div>

<div id="loading">
  <div class="load-box">
    <h1 class="logo">HYPER<span>DRIVE</span></h1>
    <div class="load-team">by <b>OVERDRIVE</b> 009</div>
    <div class="load-bar"><i id="load-bar"></i></div>
    <div id="loading-status" role="status" aria-live="polite">Loading…</div>
    <button class="btn sm hidden" id="loading-retry" type="button">Reload</button>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
